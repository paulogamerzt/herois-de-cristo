<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relatório de Pontuação</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
  .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
  
  /* Barra de progresso superior */
  .top-bar { display: flex; gap: 10px; margin-bottom: 25px; }
  .top-progress {
    flex: 1;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    height: 35px;
    position: relative;
  }
  .top-fill {
    height: 100%;
    width: 0%;
    transition: 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 14px;
  }
  .katarina { background: #e91e63; }
  .joao { background: #2196f3; }
  .ellen { background: #ff9800; }

  /* Cards dos jogadores */
  .players-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  .player-card {
    background: #fafafa;
    padding: 15px;
    border-radius: 6px;
    border-top: 4px solid;
    position: relative;
  }
  .katarina-card { border-color: #e91e63; }
  .joao-card { border-color: #2196f3; }
  .ellen-card { border-color: #ff9800; }

  .player-name { font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .player-score { font-size: 13px; color: #555; }

  /* Painel de ações */
  .action-panel {
    margin: 20px 0;
    padding: 15px;
    background: #f0f0f0;
    border-radius: 6px;
    text-align: center;
  }
  
  button { 
    padding: 10px 20px; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    color: white; 
    font-size: 14px; 
    font-weight: bold;
  }
  .report-btn { background: #607d8b; }
  .report-btn:hover { background: #455a64; }

  .report { margin-top: 25px; padding: 15px; background: #fafafa; border-radius: 5px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }
  th {
    background: #e0e0e0;
  }

  @media (max-width: 700px) {
    .players-grid { grid-template-columns: 1fr; }
    .top-bar { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>Controle de Pontuação</h2>
  
  <!-- Barra de progresso superior -->
  <div class="top-bar" id="topBar"></div>

  <!-- Painel de ações -->
  <div class="action-panel">
    <button class="report-btn" onclick="generateGeneralReport()">📊 Gerar Relatório Geral</button>
  </div>

  <!-- Cards dos jogadores -->
  <div class="players-grid" id="playersGrid"></div>

  <!-- Relatório -->
  <div class="report" id="report"></div>
</div>

<script>
const maxScore = 100;
let players = [
  { name: "Katarina Van Bora", score: 0, class: "katarina", cardClass: "katarina-card" },
  { name: "João Huss", score: 0, class: "joao", cardClass: "joao-card" },
  { name: "Ellen G. White", score: 0, class: "ellen", cardClass: "ellen-card" }
];

function render() {
  // Barra superior
  const topBar = document.getElementById('topBar');
  topBar.innerHTML = '';
  players.forEach((p) => {
    const percent = Math.max(0, Math.min(100, (p.score / maxScore) * 100));
    topBar.innerHTML += `
      <div class="top-progress">
        <div class="top-fill ${p.class}" style="width:${percent}%">${p.name} - ${Math.round(percent)}%</div>
      </div>
    `;
  });

  // Cards inferiores
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';
  players.forEach((p) => {
    grid.innerHTML += `
      <div class="player-card ${p.cardClass}">
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score} / ${maxScore} pts</div>
      </div>
    `;
  });
}

function generateGeneralReport() {
  const date = new Date().toLocaleString('pt-BR');
  
  let rows = '';
  let total = 0;
  players.forEach(p => {
    const percent = Math.round((p.score / maxScore) * 100);
    rows += `<tr>
      <td>${p.name}</td>
      <td>${p.score} pts</td>
      <td>${percent}%</td>
    </tr>`;
    total += p.score;
  });

  let html = `
    <h3>Relatório Geral de Pontuação</h3>
    <p><strong>Data:</strong> ${date}</p>
    <p><strong>Pontuação Máxima:</strong> ${maxScore} pts</p>
    <table>
      <thead>
        <tr>
          <th>Jogador</th>
          <th>Pontuação</th>
          <th>Progresso</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
      <tfoot>
        <tr style="font-weight: bold; background: #f5f5f5;">
          <td>Total</td>
          <td>${total} pts</td>
          <td>${Math.round((total / (players.length * maxScore)) * 100)}%</td>
        </tr>
      </tfoot>
    </table>
  `;

  document.getElementById('report').innerHTML = html;

  let win = window.open();
  win.document.write(`<html><body style="font-family:Arial;padding:20px;">${html}</body></html>`);
}

render();
</script>
</body>
</html>
