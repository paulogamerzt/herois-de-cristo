<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Pontuação</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
 .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }

 .top-bar { display: flex; gap: 10px; margin-bottom: 25px; }
 .top-progress {
    flex: 1;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    height: 35px;
  }
 .top-fill {
    height: 100%;
    width: 0%;
    transition: 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 14px;
  }
 .katarina { background: #e91e63; }
 .joao { background: #2196f3; }
 .ellen { background: #ff9800; }

 .players-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
 .player-card {
    background: #fafafa;
    padding: 15px;
    border-radius: 6px;
    border-top: 4px solid;
    position: relative;
  }
 .katarina-card { border-color: #e91e63; }
 .joao-card { border-color: #2196f3; }
 .ellen-card { border-color: #ff9800; }

 .player-name { font-weight: bold; font-size: 15px; margin-bottom: 8px; }
 .player-score { font-size: 13px; color: #555; margin-bottom: 12px; }

 .select-box {
    position: absolute;
    top: 10px;
    right: 10px;
    transform: scale(1.3);
  }

 .send-panel {
    margin: 20px 0;
    padding: 15px;
    background: #f0f0f0;
    border-radius: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type="number"] {
    width: 80px;
    padding: 6px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }

  button { padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; color: white; font-size: 13px; }
 .add { background: #4caf50; }
 .remove { background: #f44336; }
 .report-btn { background: #607d8b; width: 100%; margin-top: 8px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

 .loading { text-align: center; color: #666; padding: 20px; }
 .error { color: #f44336; background: #ffebee; padding: 10px; border-radius: 4px; margin: 10px 0; }

 .report { margin-top: 25px; padding: 15px; background: #fafafa; border-radius: 5px; }
  li { margin: 5px 0; font-size: 14px; }

  @media (max-width: 700px) {
   .players-grid { grid-template-columns: 1fr; }
   .top-bar { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>Controle de Pontuação</h2>

  <div class="top-bar" id="topBar"></div>

  <div class="send-panel">
    <label><strong>Pontos:</strong></label>
    <input type="number" id="pointsInput" value="10" step="5">
    <button class="add" id="btnAdd">Enviar +</button>
    <button class="remove" id="btnRemove">Enviar -</button>
  </div>

  <div class="players-grid" id="playersGrid"></div>
  <div id="status"></div>
  <div class="report" id="report"></div>
</div>

<script>
// CONFIGURAÇÃO DA API
const API_URL = 'https://sua-api.com/api'; // Muda aqui pra URL da sua API
const maxScore = 100;
let players = [];

async function loadPlayers() {
  showStatus('Carregando...', 'loading');
  try {
    const res = await fetch(`${API_URL}/players`);
    if (!res.ok) throw new Error('Erro ao carregar jogadores');
    players = await res.json();
    render();
    clearStatus();
  } catch (err) {
    showStatus('Erro: ' + err.message, 'error');
  }
}

function render() {
  // Barra superior
  const topBar = document.getElementById('topBar');
  topBar.innerHTML = '';
  players.forEach((p) => {
    const percent = Math.max(0, Math.min(100, (p.score / maxScore) * 100));
    topBar.innerHTML += `
      <div class="top-progress">
        <div class="top-fill ${p.class}" style="width:${percent}%">${p.name} - ${Math.round(percent)}%</div>
      </div>
    `;
  });

  // Cards inferiores
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';
  players.forEach((p, i) => {
    grid.innerHTML += `
      <div class="player-card ${p.cardClass}">
        <input type="checkbox" class="select-box" ${p.selected? 'checked' : ''} onchange="toggleSelect(${i})">
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score} / ${maxScore} pts</div>
        <button class="report-btn" onclick="generateReport(${i})">Gerar Relatório</button>
      </div>
    `;
  });
}

function toggleSelect(index) {
  players[index].selected =!players[index].selected;
}

async function sendPoints(direction) {
  const points = parseInt(document.getElementById('pointsInput').value) || 0;
  const value = points * direction;
  const selectedPlayers = players.filter(p => p.selected);

  if (selectedPlayers.length === 0) {
    alert("Selecione pelo menos um jogador!");
    return;
  }

  setButtonsDisabled(true);

  try {
    // Envia pra API
    const res = await fetch(`${API_URL}/update-score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        players: selectedPlayers.map(p => p.id),
        points: value
      })
    });

    if (!res.ok) throw new Error('Erro ao atualizar pontuação');

    // Recarrega dados atualizados da API
    await loadPlayers();

  } catch (err) {
    showStatus('Erro: ' + err.message, 'error');
  } finally {
    setButtonsDisabled(false);
  }
}

function generateReport(index) {
  const p = players[index];
  const percent = Math.round(Math.max(0, Math.min(100, (p.score / maxScore) * 100)));

  let html = `
    <h3>Relatório - ${p.name}</h3>
    <p><strong>Pontuação:</strong> ${p.score} / ${maxScore} (${percent}%)</p>
    <p><strong>Data:</strong> ${new Date().toLocaleString('pt-BR')}</p>
    <h4>Histórico:</h4>
    <ul>${p.log?.map(item => `<li>${item}</li>`).join('') || '<li>Sem registros</li>'}</ul>
  `;

  document.getElementById('report').innerHTML = html;

  let win = window.open();
  win.document.write(`<html><body style="font-family:Arial;padding:20px;">${html}</body></html>`);
}

function setButtonsDisabled(disabled) {
  document.getElementById('btnAdd').disabled = disabled;
  document.getElementById('btnRemove').disabled = disabled;
}

function showStatus(msg, type) {
  document.getElementById('status').innerHTML = `<div class="${type}">${msg}</div>`;
}

function clearStatus() {
  document.getElementById('status').innerHTML = '';
}

// Event listeners
document.getElementById('btnAdd').onclick = () => sendPoints(1);
document.getElementById('btnRemove').onclick = () => sendPoints(-1);

// Carrega dados ao iniciar
loadPlayers();
</script>
</body>
</html>
