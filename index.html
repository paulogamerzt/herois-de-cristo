<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relatório de Pontuação</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
  .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
  
  /* Barra de progresso superior RGB */
  .top-bar { display: flex; gap: 10px; margin-bottom: 25px; }
  .top-progress {
    flex: 1;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    height: 35px;
    position: relative;
  }
  .top-fill {
    height: 100%;
    width: 0%;
    transition: 0.4s;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
    background-size: 400% 400%;
    animation: rgb-move 4s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  @keyframes rgb-move {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Cards dos jogadores */
  .players-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  .player-card {
    background: #fafafa;
    padding: 15px;
    border-radius: 6px;
    border-top: 4px solid;
    position: relative;
  }
  .katarina-card { border-color: #e91e63; }
  .joao-card { border-color: #2196f3; }
  .ellen-card { border-color: #ff9800; }

  .player-name { font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .player-score { font-size: 13px; color: #555; margin-bottom: 12px; }
  
  /* Checkbox de seleção */
  .select-box {
    position: absolute;
    top: 10px;
    right: 10px;
    transform: scale(1.3);
  }

  /* Painel de envio */
  .send-panel {
    margin: 20px 0;
    padding: 15px;
    background: #f0f0f0;
    border-radius: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type="number"] {
    width: 80px;
    padding: 6px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  
  button { padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; color: white; font-size: 13px; }
  .add { background: #4caf50; }
  .remove { background: #f44336; }
  .report-btn { background: #607d8b; width: 100%; margin-top: 8px; }

  .report { margin-top: 25px; padding: 15px; background: #fafafa; border-radius: 5px; }
  li { margin: 5px 0; font-size: 14px; }

  @media (max-width: 700px) {
    .players-grid { grid-template-columns: 1fr; }
    .top-bar { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>Controle de Pontuação - Máx: 10.000 pts</h2>
  
  <!-- Barra de progresso superior RGB -->
  <div class="top-bar" id="topBar"></div>

  <!-- Painel de envio -->
  <div class="send-panel">
    <label><strong>Pontos:</strong></label>
    <input type="number" id="pointsInput" value="100" step="50">
    <button class="add" onclick="sendPoints(1)">Enviar +</button>
    <button class="remove" onclick="sendPoints(-1)">Enviar -</button>
  </div>

  <!-- Controles por jogador -->
  <div class="players-grid" id="playersGrid"></div>

  <!-- Relatório -->
  <div class="report" id="report"></div>
</div>

<script>
const maxScore = 10000;
let players = [
  { name: "Katarina Van Bora", score: 0, log: [], cardClass: "katarina-card", selected: false },
  { name: "João Huss", score: 0, log: [], cardClass: "joao-card", selected: false },
  { name: "Ellen G. White", score: 0, log: [], cardClass: "ellen-card", selected: false }
];

function render() {
  // Barra superior RGB sem nome
  const topBar = document.getElementById('topBar');
  topBar.innerHTML = '';
  players.forEach((p) => {
    const percent = Math.max(0, Math.min(100, (p.score / maxScore) * 100));
    topBar.innerHTML += `
      <div class="top-progress">
        <div class="top-fill" style="width:${percent}%">${Math.round(percent)}%</div>
      </div>
    `;
  });

  // Cards inferiores
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';
  players.forEach((p, i) => {
    grid.innerHTML += `
      <div class="player-card ${p.cardClass}">
        <input type="checkbox" class="select-box" ${p.selected ? 'checked' : ''} onchange="toggleSelect(${i})">
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score.toLocaleString('pt-BR')} / ${maxScore.toLocaleString('pt-BR')} pts</div>
        <button class="report-btn" onclick="generateReport(${i})">Gerar Relatório</button>
      </div>
    `;
  });
}

function toggleSelect(index) {
  players[index].selected = !players[index].selected;
}

function sendPoints(direction) {
  const points = parseInt(document.getElementById('pointsInput').value) || 0;
  const value = points * direction;
  
  let changed = false;
  players.forEach((p, i) => {
    if (p.selected) {
      p.score += value;
      if (p.score < 0) p.score = 0;
      if (p.score > maxScore) p.score = maxScore;
      const action = value > 0 ? `+${value.toLocaleString('pt-BR')}` : `${value.toLocaleString('pt-BR')}`;
      p.log.push(`${action} pts - ${new Date().toLocaleTimeString()}`);
      changed = true;
    }
  });
  
  if (!changed) {
    alert("Selecione pelo menos um jogador!");
    return;
  }
  render();
}

function generateReport(index) {
  const p = players[index];
  const percent = Math.round(Math.max(0, Math.min(100, (p.score / maxScore) * 100)));

  let html = `
    <h3>Relatório - ${p.name}</h3>
    <p><strong>Pontuação:</strong> ${p.score.toLocaleString('pt-BR')} / ${maxScore.toLocaleString('pt-BR')} (${percent}%)</p>
    <p><strong>Data:</strong> ${new Date().toLocaleString('pt-BR')}</p>
    <h4>Histórico:</h4>
    <ul>${p.log.map(item => `<li>${item}</li>`).join('') || '<li>Sem registros</li>'}</ul>
  `;

  document.getElementById('report').innerHTML = html;

  let win = window.open();
  win.document.write(`<html><body style="font-family:Arial;padding:20px;">${html}</body></html>`);
}

render();
</script>
</body>
</html>
